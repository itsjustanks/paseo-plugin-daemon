name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: full checks (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hygiene
        run: npm run check:hygiene

      - name: Typecheck
        run: npm run typecheck

      - name: Check both Paseo entry formats
        run: npm run test:compatibility

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  macos:
    name: platform checks (macos)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test macOS adapter and real signals
        run: npx vitest run tests/darwin.test.ts tests/disposable-child.test.ts
