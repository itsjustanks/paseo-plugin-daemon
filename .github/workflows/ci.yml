name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: full checks (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup daemon Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Import bootstrap before dependency installation
        run: node --input-type=module -e "await import('./scripts/browser/bootstrap.mjs')"

      - name: Setup browser runtime Node for installation
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --engine-strict

      - name: Restore daemon Node for bridge checks
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Check private bootstrap and bridge closure
        run: npm run test:browser-build

      - name: Check supported Paseo runtimes
        run: npm run test:compatibility

      - name: Restore browser runtime Node for full checks
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Hygiene
        run: npm run check:hygiene

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  macos:
    name: platform checks (macos)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test macOS adapter and real signals
        run: npx vitest run tests/darwin.test.ts tests/disposable-child.test.ts
